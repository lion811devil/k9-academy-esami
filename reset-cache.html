<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset cache K9 Academy</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f3f8;color:#241f2b;margin:0;padding:24px}
.card{max-width:640px;margin:10vh auto;background:#fff;border:1px solid #ddd6e4;border-radius:20px;padding:24px}
button{width:100%;padding:15px;border:0;border-radius:14px;background:#5b21b6;color:white;font-size:17px;font-weight:800}
#status{margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
<h1>Reset cache K9 Academy</h1>
<p>Elimina esclusivamente cache e Service Worker della PWA. Non modifica account, esami o dati Supabase.</p>
<button id="resetBtn">RESET CACHE APP</button>
<div id="status"></div>
</div>
<script>
document.getElementById('resetBtn').onclick=async()=>{
 const status=document.getElementById('status');
 const btn=document.getElementById('resetBtn');
 btn.disabled=true;status.textContent='Pulizia in corso...';
 try{
   if('serviceWorker' in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(r=>r.unregister()));
   }
   if('caches' in window){
     const keys=await caches.keys();
     await Promise.all(keys.map(k=>caches.delete(k)));
   }
   status.innerHTML='<b>Cache eliminata.</b><br>Chiudi completamente questa pagina e l’app, poi riapri K9 Academy.';
 }catch(e){
   status.textContent='Errore durante il reset: '+(e.message||e);
 }finally{btn.disabled=false}
};
</script>
</body></html>
